<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexora Admin — כניסה</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1724;--cream:#f6f3ed;--gold:#b89a63;--sans:Inter,Arial,sans-serif;--serif:'Cormorant Garamond',Georgia,serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--navy);color:#fff;font-family:var(--sans);display:grid;place-items:center;padding:24px}.login-card{width:min(470px,100%);padding:48px 42px;background:var(--cream);color:var(--navy);border:1px solid rgba(184,154,99,.55);box-shadow:0 25px 70px rgba(0,0,0,.3)}.brand{font-size:12px;font-weight:600;letter-spacing:.2em;color:#92794d;text-align:center}.brand b{color:var(--navy)}h1{font:600 48px/1 var(--serif);text-align:center;margin:20px 0 12px}.intro{text-align:center;color:#64717b;font-size:13px;line-height:1.8;margin:0 0 30px}.field{margin:0 0 17px}.field label{display:block;font-size:11px;font-weight:600;letter-spacing:.07em;color:#4e5b66;margin-bottom:7px}.field input{width:100%;height:48px;border:1px solid #c9c5bb;background:#fff;padding:0 13px;font:14px var(--sans);color:var(--navy);outline:none;direction:ltr;text-align:left}.field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,154,99,.13)}button{width:100%;height:49px;margin-top:8px;border:1px solid #78b980;background:#6eae76;color:#fff;font:600 13px var(--sans);cursor:pointer}button:hover{background:#78b980}button:disabled{opacity:.65;cursor:wait}.hint{font-size:11px;color:#78828a;text-align:center;line-height:1.7;margin:16px 0 0}.error{display:none;margin-top:15px;padding:11px;background:#f8e9e7;color:#9c3730;font-size:12px;line-height:1.6}.error.show{display:block}@media(max-width:520px){.login-card{padding:38px 24px}h1{font-size:42px}}
</style>
</head>
<body>
<main class="login-card">
<div class="brand">NEXORA <b>ADMIN</b></div>
<h1>כניסה לאזור האישי</h1>
<p class="intro">הזן את הפרטים שלך כדי להיכנס לעריכת האתר</p>
<form id="loginForm" novalidate>
<div class="field"><label for="name">שם מלא</label><input id="name" name="name" type="text" autocomplete="name" placeholder="הזן שם מלא"></div>
<div class="field"><label for="email">כתובת אימייל</label><input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com"></div>
<div class="field"><label for="phone">מספר טלפון</label><input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="050-000-0000"></div>
<button id="loginButton" type="submit">כניסה לעריכת האתר</button>
<div class="error" id="loginError" role="alert"></div>
</form>
<p class="hint">בשלב זה יש להזין כתובת אימייל. שם ומספר טלפון אינם נדרשים.</p>
</main>
<script>
(() => {
  // Python Admin endpoint — the server will be built to this contract.
  const LOGIN_API = "/api/admin/login";
  const SESSION_KEY = "nexora_admin_session";
  const form=document.getElementById("loginForm"),button=document.getElementById("loginButton"),error=document.getElementById("loginError");
  form.addEventListener("submit",async event=>{
    event.preventDefault();error.classList.remove("show");
    const payload={name:document.getElementById("name").value.trim(),email:document.getElementById("email").value.trim(),phone:document.getElementById("phone").value.trim()};
    if(!payload.email){error.textContent="יש להזין כתובת אימייל כדי להמשיך.";error.classList.add("show");return;}
    const old=button.textContent;button.disabled=true;button.textContent="בודק פרטים...";
    try{
      const response=await fetch(LOGIN_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
      const result=await response.json();
      if(!response.ok||!result.success)throw new Error(result.error||"לא נמצאו פרטים מתאימים.");
      if(!result.slot_id||!result.site)throw new Error("שרת Admin לא החזיר slot_id ונתוני אתר.");
      const session={slot_id:result.slot_id,site:result.site,image:result.image||"",session_id:result.session_id||crypto.randomUUID()};
      sessionStorage.setItem(SESSION_KEY,JSON.stringify(session));
      location.href="editor.html";
    }catch(err){error.textContent=err.message||"אירעה שגיאה. נסה שוב.";error.classList.add("show");}
    finally{button.disabled=false;button.textContent=old;}
  });
})();
</script>
</body>
</html>
